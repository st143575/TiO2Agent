# TiO2Agent: one-command deployment
#
#   docker compose up -d --build              # API on http://localhost:8000 (docs: /docs)
#
# Optional parts (combine as needed):
#   + LLM inside Compose (Ollama, pulls TIO2_LLM_MODEL on first start):
#       docker compose -f compose.yaml -f compose.ollama.yaml up -d --build
#     On an NVIDIA host add -f compose.ollama-gpu.yaml. On a Mac, run Ollama natively
#     instead (Docker cannot use the Apple GPU) and set TIO2_LLM_BACKEND=openai_compatible
#     in .env: the app reaches it at host.docker.internal.
#   + OCR for image tables (PaddleOCR-VL, NVIDIA GPU, CUDA >= 12.6):
#       docker compose --profile ocr up -d    and set TIO2_OCR_BACKEND=paddleocr_vl
#
# Settings come from .env (copy .env.example). Data (PDFs, SQLite, results) lives in
# the named volume "app-data" and survives restarts and rebuilds.
# Requires Docker Compose v2.20+ (optional depends_on).

name: tio2agent

services:
  app:
    build: .
    image: tio2agent:latest
    ports:
      - "${TIO2_PORT:-8000}:8000"
    environment:
      TIO2_LOG_LEVEL: ${TIO2_LOG_LEVEL:-INFO}
      TIO2_MAX_UPLOAD_MB: ${TIO2_MAX_UPLOAD_MB:-50}
      TIO2_MAX_PAGES: ${TIO2_MAX_PAGES:-200}
      TIO2_INGEST_WORKERS: ${TIO2_INGEST_WORKERS:-2}
      # OCR
      TIO2_OCR_BACKEND: ${TIO2_OCR_BACKEND:-none}
      TIO2_OCR_BASE_URL: http://paddleocr-vl-api:8080
      TIO2_OCR_TIMEOUT_S: ${TIO2_OCR_TIMEOUT_S:-300}
      # Chunking and search
      TIO2_CHUNK_MAX_CHARS: ${TIO2_CHUNK_MAX_CHARS:-600}
      TIO2_SEARCH_TOP_K: ${TIO2_SEARCH_TOP_K:-8}
      TIO2_SEARCH_RRF_K: ${TIO2_SEARCH_RRF_K:-60}
      # Services on the host or elsewhere. The DOCKER_*_BASE_URL variables are separate
      # from TIO2_*_BASE_URL (local runs): inside the container "localhost" is the
      # container itself, and a server on the host is host.docker.internal.
      TIO2_EMBEDDING_BACKEND: ${TIO2_EMBEDDING_BACKEND:-none}
      TIO2_EMBEDDING_BASE_URL: ${DOCKER_EMBEDDING_BASE_URL:-http://host.docker.internal:11434/v1}
      TIO2_EMBEDDING_MODEL: ${TIO2_EMBEDDING_MODEL:-bge-m3}
      TIO2_EMBEDDING_API_KEY: ${TIO2_EMBEDDING_API_KEY:-}
      TIO2_RERANK_BACKEND: ${TIO2_RERANK_BACKEND:-none}
      TIO2_RERANK_BASE_URL: ${DOCKER_RERANK_BASE_URL:-http://host.docker.internal:8001/v1}
      TIO2_RERANK_MODEL: ${TIO2_RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      TIO2_RERANK_API_KEY: ${TIO2_RERANK_API_KEY:-}
      TIO2_RERANK_CANDIDATES: ${TIO2_RERANK_CANDIDATES:-30}
      TIO2_LLM_BACKEND: ${TIO2_LLM_BACKEND:-none}
      TIO2_LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      TIO2_LLM_MODEL: ${TIO2_LLM_MODEL:-qwen3:8b}
      TIO2_LLM_API_KEY: ${TIO2_LLM_API_KEY:-}
      TIO2_LLM_TEMPERATURE: ${TIO2_LLM_TEMPERATURE:-0}
      TIO2_LLM_MAX_TOKENS: ${TIO2_LLM_MAX_TOKENS:-2048}
      TIO2_LLM_TIMEOUT_S: ${TIO2_LLM_TIMEOUT_S:-120}
      TIO2_EXTRACT_BACKEND: ${TIO2_EXTRACT_BACKEND:-rules}
      TIO2_EXTRACT_LLM_MODEL: ${TIO2_EXTRACT_LLM_MODEL:-}
      TIO2_EXTRACT_LLM_REASONING_EFFORT: ${TIO2_EXTRACT_LLM_REASONING_EFFORT-none}
      TIO2_EXTRACT_LLM_TEMPERATURE: ${TIO2_EXTRACT_LLM_TEMPERATURE:-0}
      TIO2_EXTRACT_LLM_MAX_TOKENS: ${TIO2_EXTRACT_LLM_MAX_TOKENS:-4096}
      TIO2_EXTRACT_LLM_TIMEOUT_S: ${TIO2_EXTRACT_LLM_TIMEOUT_S:-300}
      TIO2_EXTRACT_LLM_MAX_FAILURES: ${TIO2_EXTRACT_LLM_MAX_FAILURES:-2}
      # Agent
      TIO2_AGENT_MAX_STEPS: ${TIO2_AGENT_MAX_STEPS:-8}
      TIO2_AGENT_HISTORY_TURNS: ${TIO2_AGENT_HISTORY_TURNS:-4}
      TIO2_AGENT_TOOL_RESULT_CHARS: ${TIO2_AGENT_TOOL_RESULT_CHARS:-6000}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux; Docker Desktop provides it already
    volumes:
      - app-data:/app/data
    depends_on:
      paddleocr-vl-api:
        condition: service_healthy
        required: false   # only waited for when the "ocr" profile is active
    restart: unless-stopped

  # --- PaddleOCR-VL pipeline (optional) -------------------------------------------
  # Adapted from PaddlePaddle/PaddleOCR deploy/paddleocr_vl_docker/accelerators/
  # nvidia-gpu/compose.yaml (Apache-2.0). Two containers: the pipeline API (layout
  # detection + /layout-parsing) and the VLM inference server it calls. The service
  # name "paddleocr-vlm-server" must not change: the pipeline config baked into the
  # API image points at http://paddleocr-vlm-server:8080/v1.
  #
  # Images are pulled from Baidu's registry (several GB). For reproducible builds,
  # pin a release, e.g. PADDLEOCR_IMAGE_TAG=paddleocr3.3-nvidia-gpu-offline.

  paddleocr-vl-api:
    profiles: [ocr]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-vl:${PADDLEOCR_IMAGE_TAG:-latest-nvidia-gpu-offline}
    ports:
      - "127.0.0.1:${PADDLEOCR_PORT:-8080}:8080"   # host access for scripts/eval_ocr_table.py
    depends_on:
      paddleocr-vlm-server:
        condition: service_healthy
    environment:
      - VLM_BACKEND=${PADDLEOCR_VLM_BACKEND:-vllm}
    command: /bin/bash -c "paddlex --serve --pipeline /home/paddleocr/pipeline_config_${PADDLEOCR_VLM_BACKEND:-vllm}.yaml"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PADDLEOCR_GPU_ID:-0}"]
              capabilities: [gpu]
    shm_size: ${PADDLEOCR_SHM_SIZE:-64g}
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      start_period: 120s

  paddleocr-vlm-server:
    profiles: [ocr]
    image: ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-${PADDLEOCR_VLM_BACKEND:-vllm}-server:${PADDLEOCR_IMAGE_TAG:-latest-nvidia-gpu-offline}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${PADDLEOCR_GPU_ID:-0}"]
              capabilities: [gpu]
    shm_size: ${PADDLEOCR_SHM_SIZE:-64g}
    user: root
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      start_period: 300s

volumes:
  app-data:
